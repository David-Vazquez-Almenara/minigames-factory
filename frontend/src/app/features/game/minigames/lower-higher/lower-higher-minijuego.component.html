<div class="plantilla-container" appMinigameFullscreen>
  <main class="game-area">





    <div class="score-display">
      <span>Número de aciertos: </span>
      <strong class="score-number">{{ points }}</strong>
    </div>


    <!-- debe actualizarse por cada click en checkAnswer -->
    {{this.roundItem}}



    <div id="cardsContainer">
      <!-- Muestra un ngfor de solo dos cartas con su this.hostMinigameData.selectedItem[roundItem[0]] y this.hostMinigameData.selectedItem[roundItem[1]] -->
      <div *ngFor="let index of roundItem">
        <div (click)="checkAnswer(index)" class="card" style="border: solid 2px black;" [ngClass]="{
          'fail-animation': failAnimationStart == true}">
          <img [src]="hostMinigameData.selectedItem[index].image">
          <p>{{ hostMinigameData.selectedItem[index].name }}</p>
          <p>{{ hostMinigameData.selectedItem[index].price }}</p>
        </div>
      </div>
    </div>





  </main>
</div>
