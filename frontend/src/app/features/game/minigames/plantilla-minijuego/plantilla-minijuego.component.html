<div class="plantilla-container">

  <!-- 2. Área de Juego Principal -->
  <main class="game-area">
    <div class="score-display">
      <span>Puntos actuales: </span>
      <strong class="score-number">{{ points }}</strong>
    </div>

    <!-- Botón del centro para la lógica interactiva -->
    <button class="action-btn" (click)="pulsar()">
      ¡PÚLSAME!
    </button>
  </main>

</div>
