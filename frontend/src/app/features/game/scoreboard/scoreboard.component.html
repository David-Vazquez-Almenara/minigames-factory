<section class="scoreboard-screen" aria-label="Resultados de la tanda">
  <main class="scoreboard-panel">
    <header>
      <p>Tanda {{ scoreboard()?.roundNumber || match()?.questionRoundNumber || 1 }}</p>
      <h1>Resultados</h1>
    </header>

    <div class="score-list" [class.positions-settled]="positionsSettled()">
      @for (row of rows(); track row.playerId) {
      <article class="score-row" [class.score-up]="row.scoreIncreased">
        <strong class="position">{{ row.position }}o</strong>
        <span class="player-name">{{ row.playerName }}</span>
        <strong class="score">{{ row.displayScore }} pts</strong>
      </article>
      }
    </div>

    @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }

    <button class="continue-button" type="button" [disabled]="!canContinue()" (click)="continueToNextBatch()">
      {{ loading() ? 'Continuando...' : isHost() ? 'Continuar' : 'Esperando al host' }}
    </button>
  </main>
</section>
